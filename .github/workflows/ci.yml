name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install API dependencies
        run: python -m pip install -r api/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -q

      - name: Compile Python modules
        run: >-
          python -m py_compile
          api/server.py
          workflow_runner/runner.py
          skills/transcript/build_docs_logical.py
          skills/transcript/validate_docs.py
          skills/transcript/validate_map.py
          skills/transcript/validate_variants.py
